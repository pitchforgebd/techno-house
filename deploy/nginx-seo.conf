# Techno House — SEO nginx snippets for the LIVE server (technohouse.com.bd)
#
# The live site file is not identical to deploy/nginx-techno-house.conf (live
# answers HTTP/1.1 only, the repo template has http2), so these are written
# as blocks to merge by hand rather than a file to copy over the old one.
#
# The app itself (middleware.ts) already 301s www -> apex once the new build
# is deployed; doing it here as well just saves the proxy hop.
#
# How to apply:
#   1. Check the certificate covers www:   sudo certbot certificates
#   2. Back up the live file:              sudo cp /etc/nginx/sites-available/<site> ~/nginx-<site>-$(date +%Y%m%d).bak
#   3. Edit /etc/nginx/sites-available/<site>:
#        a) In the port-80 server block, change
#             return 301 https://$host$request_uri;
#           to
#             return 301 https://technohouse.com.bd$request_uri;
#           (if certbot wrote "if ($host = ...) { return 301 ... }" lines
#           instead, replace those whole if-blocks with the single return).
#        b) In the port-443 server block that proxies to the app, remove
#           www.technohouse.com.bd from server_name.
#        c) Add the www server block below.
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Verify:
#        curl -I https://www.technohouse.com.bd/warranty   -> 301, location: https://technohouse.com.bd/warranty
#        curl -I http://www.technohouse.com.bd/warranty    -> 301, location: https://technohouse.com.bd/warranty
#        curl -I http://technohouse.com.bd/warranty        -> 301, location: https://technohouse.com.bd/warranty
#        curl -I https://technohouse.com.bd/warranty       -> 200

# ---- (a) port 80: everything to the canonical https origin in one hop ----
# server {
#     listen 80;
#     listen [::]:80;
#     server_name technohouse.com.bd www.technohouse.com.bd;
#
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#     location / {
#         return 301 https://technohouse.com.bd$request_uri;
#     }
# }

# ---- (c) https://www -> https://technohouse.com.bd ----
# Use the SAME ssl_certificate paths as your existing 443 block (copy them
# from there — certbot may have named the directory differently).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.technohouse.com.bd;

    ssl_certificate     /etc/letsencrypt/live/technohouse.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technohouse.com.bd/privkey.pem;

    return 301 https://technohouse.com.bd$request_uri;
}


# =============================================================================
# SEO PHASE 4 — HTTP/2, no version banner, compression, long caching, and
# serving the pre-converted WebP / .min.svg copies of uploads
# =============================================================================
#
# What the live server does today (checked 2026-11-09 with curl):
#   - HTTP/1.1 only, "Server: nginx/1.24.0 (Ubuntu)" (version banner on)
#   - /uploads/* files have NO Cache-Control header at all -> every repeat
#     visit revalidates every image
#   - SVG is sent uncompressed (the 315 KB payment strip = 315 KB on the wire)
#   - /_next/static/* already gets "public, max-age=31536000, immutable" from
#     Next.js (proxied); serving it from disk below takes it off Node's CPU.
#
# nginx 1.24 note: the standalone "http2 on;" directive only exists from
# nginx 1.25.1. On 1.24 HTTP/2 is switched on with "http2" on the listen line.
#
# How to apply (each step is a small edit to the LIVE site file):
#   0. Back up and look at what is there now:
#        sudo cp /etc/nginx/sites-available/<site> ~/nginx-<site>-$(date +%Y%m%d-%H%M).bak
#        sudo nginx -T 2>/dev/null | grep -nE "listen|server_name|server_tokens|gzip|location|alias|root " | head -60
#      (These blocks were syntax-checked with nginx -t and exercised locally on
#      2026-11-09: png→webp only with Accept: image/webp, original otherwise,
#      .min.webp/.min.svg picked up, gzip on SVG, 404 for missing files.)
#      Note the directory your existing "location /uploads/" points at
#      (its alias). Below it is written as APP_DIR = /home/deploy/techno-house;
#      if yours differs, use yours everywhere APP_DIR appears.
#
#   1. HTTP/2 — in EVERY server block that listens on 443 (the main site and
#      the www redirect block from phase 1), change
#          listen 443 ssl;          ->  listen 443 ssl http2;
#          listen [::]:443 ssl;     ->  listen [::]:443 ssl http2;
#
#   2. Version banner + compression — inside the main 443 server block (the one
#      with "location / { proxy_pass ... }"), add near the top:
#
#          server_tokens off;
#
#          gzip on;
#          gzip_vary on;
#          gzip_comp_level 5;
#          gzip_min_length 1024;
#          gzip_proxied any;
#          gzip_types text/css application/javascript application/json
#                     image/svg+xml application/xml text/xml text/plain;
#
#      (server_tokens off only hides the version number; nginx still says
#      "nginx". If you already have gzip lines in /etc/nginx/nginx.conf, keep
#      one copy — nginx -t complains about duplicates in the same block.)
#
#   3. Pick the WebP copy when the browser accepts it — add this ONE block at
#      the very top of the site file, OUTSIDE every server { } block (site files
#      are included inside http { }, which is where a map has to live):
#
#          map $http_accept $th_webp_suffix {
#              default        "";
#              "~*image/webp" ".webp";
#          }
#
#   4. Uploads — inside the main 443 server block, keep your existing
#      "location /uploads/ { alias ...; }" (it still serves gif/pdf/etc.) and
#      ADD these four blocks next to it. Regex locations win over the plain
#      /uploads/ prefix, so these take the image types:
#
#          # png/jpeg: serve foo.webp (made by scripts/optimize-uploads.mjs or
#          # the admin upload handler) to browsers that accept WebP, else the
#          # original. Same URL either way, so no database change.
#          location ~ ^/uploads/(?<th_up>.+)\.(?:png|jpe?g)$ {
#              root APP_DIR/public;
#              try_files /uploads/$th_up$th_webp_suffix $uri =404;
#              add_header Vary "Accept" always;
#              add_header Cache-Control "public, max-age=2592000";
#              add_header X-Content-Type-Options "nosniff" always;
#              add_header Content-Security-Policy "sandbox" always;
#              access_log off;
#          }
#
#          # webp: serve foo.min.webp when the script made a smaller copy.
#          location ~ ^/uploads/(?<th_up>.+)\.webp$ {
#              root APP_DIR/public;
#              try_files /uploads/$th_up.min.webp $uri =404;
#              add_header Cache-Control "public, max-age=2592000";
#              add_header X-Content-Type-Options "nosniff" always;
#              add_header Content-Security-Policy "sandbox" always;
#              access_log off;
#          }
#
#          # svg: serve foo.min.svg when scripts/optimize-svg.mjs made one.
#          location ~ ^/uploads/(?<th_up>.+)\.svg$ {
#              root APP_DIR/public;
#              try_files /uploads/$th_up.min.svg $uri =404;
#              add_header Cache-Control "public, max-age=2592000";
#              add_header X-Content-Type-Options "nosniff" always;
#              add_header Content-Security-Policy "sandbox" always;
#              access_log off;
#          }
#
#      and add the same Cache-Control line to the existing /uploads/ block:
#              add_header Cache-Control "public, max-age=2592000";
#
#      (Cache-Control without "always" = only on 200/304, so a 404 is never
#      cached for 30 days.)
#      30 days, not "immutable": the bytes behind an upload URL change once,
#      when its WebP copy is created, and a normal reload should pick that up.
#      Content-Type follows the file actually served (image/webp for a copy).
#
#   5. Next.js build assets straight from disk (no Node CPU per request):
#
#          location /_next/static/ {
#              alias APP_DIR/.next/static/;
#              add_header Cache-Control "public, max-age=31536000, immutable";
#              access_log off;
#          }
#
#      (A file only exists here after "npm run build", which is also when the
#      app starts referring to it, so this serves exactly what Next.js would.)
#
#   6. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   7. Verify (from any machine):
#        curl -sI https://technohouse.com.bd/ | grep -i "^server"                                   -> "Server: nginx" (no version)
#        curl -sI --http2 https://technohouse.com.bd/ | head -1                                      -> "HTTP/2 200"
#        curl -sI -H "Accept: image/webp" https://technohouse.com.bd/uploads/general/632753d8-9de4-4af7-868f-4e06379b9c18.png | grep -iE "content-type|cache-control|vary"
#             -> after the conversion script ran: content-type: image/webp, cache-control: public, max-age=2592000, vary: Accept
#        curl -sI -H "Accept: image/png" https://technohouse.com.bd/uploads/general/632753d8-9de4-4af7-868f-4e06379b9c18.png | grep -i content-type
#             -> image/png (browsers without WebP still get the original)
#        curl -s -o /dev/null -w "%{size_download}\n" -H "Accept-Encoding: gzip" https://technohouse.com.bd/uploads/general/c96bfe7c-7673-4993-8d12-c0c3688097d7.svg
#             -> much smaller than 321794 once gzip is on
#
# Rollback: copy the backup from step 0 back and reload nginx. The WebP and
# .min.svg copies can stay on disk; without these blocks nginx ignores them.
