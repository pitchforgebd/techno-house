# Techno House — Nginx site (HTTP -> HTTPS, Next.js reverse proxy, uploads from disk)
#
# Install:
#   sudo cp deploy/nginx-techno-house.conf /etc/nginx/sites-available/techno-house
#   sudo sed -i 's/example\.com/YOUR-DOMAIN/g' /etc/nginx/sites-available/techno-house
#   sudo ln -s /etc/nginx/sites-available/techno-house /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certificate first (the 443 block needs it):
#   sudo certbot certonly --webroot -w /var/www/certbot -d YOUR-DOMAIN -d www.YOUR-DOMAIN
# (comment the 443 server block out for that first run if nginx refuses to start).
#
# Assumes this is the ONLY proxy in front of the app, so TRUSTED_PROXY_HOPS=1.
# Behind Cloudflare as well, see "Cloudflare" in docs/DEPLOY_VPS_RUNBOOK.md.

upstream techno_house_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Matches next.config.ts (serverActions bodySizeLimit / proxyClientMaxBodySize = 25mb).
    client_max_body_size 25m;

    # Uploaded media (admin media library + product images) is written to
    # public/uploads AFTER the build. `next start` only serves files that
    # existed at build time, so anything staff upload later would 404. Nginx
    # therefore serves this directory straight from disk. It is the directory
    # the app writes to (public/uploads inside the app checkout): git ignores
    # its contents, so checking out a new release never touches the files.
    #
    # These two headers replace the ones next.config.ts adds for /uploads (they
    # do not apply to files Nginx answers itself). `sandbox` stops an uploaded
    # .svg from running its own <script> when opened directly.
    location /uploads/ {
        alias /var/www/techno-house/current/public/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        # File names are UUIDs, so a given URL never changes content.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location = /api/health {
        proxy_pass http://techno_house_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://techno_house_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the app trusts the right-most hop only, and a
        # client-supplied X-Forwarded-For must not survive into it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
